name: Weekly Data Pipeline

on:
  schedule:
    # Every Monday at 6am UTC (Sunday 11pm PT)
    - cron: '0 6 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: |
          cd scraper
          pip install -r requirements.txt

      - name: Backup database
        run: |
          cd scraper
          cp data/ballot_measures.db data/ballot_measures_pre_pipeline.db

      - name: Run incremental pipeline
        run: |
          cd scraper
          python scripts/pipeline.py incremental
        env:
          LOG_LEVEL: INFO

      - name: Validate results
        run: |
          cd scraper
          python -c "
          from src.database.operations import Database
          from src.config import DB_PATH
          db = Database(DB_PATH)
          stats = db.get_statistics()
          total = stats['total_measures']
          statewide = stats['statewide_count']
          print(f'Total measures: {total}')
          print(f'Statewide: {statewide}')
          print(f'Sources: {stats[\"by_source\"]}')
          # Sanity checks
          assert total > 10000, f'Total measures too low: {total}'
          assert statewide > 1000, f'Statewide count too low: {statewide}'
          print('Validation passed')
          "

      - name: Generate website
        run: |
          cd scraper
          python scripts/generate_site.py --force

      - name: Check for changes
        id: changes
        run: |
          git diff --stat
          if git diff --quiet index.html scraper/data/ballot_measures.db; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html scraper/data/ballot_measures.db
          git commit -m "Weekly data update: $(date -u +%Y-%m-%d)

          Automated pipeline run (CA SOS + Ballotpedia statewide)"
          git push

      - name: Clean up backup
        if: always()
        run: |
          rm -f scraper/data/ballot_measures_pre_pipeline.db
